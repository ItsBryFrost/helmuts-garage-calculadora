<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Helmut's Garage</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar branco).
    try {
      const t = localStorage.getItem("helmutsGarage.tema");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="top-header">
    <div class="brand"><span class="wrench">🔧</span> MECÂNICA <span>HELMUT'S GARAGE</span></div>
    <button id="themeBtn" class="theme-btn" aria-label="Alternar modo escuro" title="Alternar modo escuro">🌙</button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="main">
    <div class="search-wrap">
      <span>🔍</span>
      <input id="search" type="search" placeholder="Digite para buscar uma peça ou serviço em todas as categorias...">
    </div>

    <section id="items" class="items-grid"></section>
    <div id="empty" class="empty hidden">Nenhum item encontrado.</div>
  </main>

  <!-- Total de materiais da ordem (preenchido pelo script.js) -->
  <section id="materials" class="materials" aria-label="Materiais necessários" aria-live="polite"></section>

  <footer class="footer">
    <div class="total-block">
      <small>TOTAL COM DESCONTO</small>
      <strong id="total">$0</strong>
      <span id="subtotal" class="subtotal"></span>
    </div>

    <select id="discount" aria-label="Desconto"></select>

    <input id="clientName" type="text" placeholder="Nome do Cliente (Opcional)">
    <input id="passport" type="text" placeholder="Passaporte / ID (Obrigatório)">

    <div class="footer-actions">
      <button id="copyBtn" class="btn copy">COPIAR</button>
      <button id="clearBtn" class="btn clear">LIMPAR</button>
      <button id="historyBtn" class="btn history hidden">HISTÓRICO</button>
      <button id="saveBtn" class="btn save">SALVAR ORDEM</button>
    </div>
  </footer>

  <!-- EXPERIMENTAL: historico -->
  <div id="historyPanel" class="overlay hidden">
    <div class="panel" role="dialog" aria-label="Histórico de ordens">
      <div class="panel-head">
        <strong>Histórico de ordens <span class="beta">BETA</span></strong>
        <button id="historyClose" class="close" aria-label="Fechar">✕</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
